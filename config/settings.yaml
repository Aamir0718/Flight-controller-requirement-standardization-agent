# Central configuration for the requirements-engineering agent.
# Nothing model-specific or environment-specific should be hardcoded
# in application code — read it from here via src/config.py instead.

ollama:
  host: "localhost"
  port: 11434
  model: gemma3:4b          # config value only, never hardcoded elsewhere
  # Raised from 120s: this machine has no GPU, so Ollama runs gemma3:4b on
  # CPU only (~2-3s/token) -- a real requirement's full system+few-shot
  # prompt takes far longer to evaluate than 120s allows, which was
  # producing ReadTimeout failures rather than genuine errors.
  request_timeout_seconds: 900
  temperature: 0.2

storage:
  sqlite_path: "data/app.db"

ingestion:
  input_dir: "data/incoming"
  reference_dir: "data/reference"
  golden_dir: "data/golden"
  # Junk/note-row heuristic: a cell must clear this word count AND
  # contain a recognizable verb to be treated as candidate requirement text.
  min_word_count: 4

pipeline:
  candidates_per_requirement: 3
  max_words_per_requirement: 60
  # Minimum INCOSE compliance score (0-100, from src/rules/incose_scorer.py)
  # the best candidate must reach before Finalize will present it as a
  # recommendation instead of setting needs_human_review = true.
  compliance_threshold: 80.0
  # Minimum INCOSE compliance score (0-100, over the ~25 automatable rules
  # IncoseCheck actually runs -- everything except R1/R37/R38, see
  # src/rules/incose_scorer.py's PRE_LLM_GATE_EXCLUDED_RULE_IDS) a
  # requirement's ORIGINAL text must reach before src/pipeline/graph.py's
  # IncoseCheck gate lets it proceed to the EARS gate and, eventually, the
  # LLM. 80.0 measured 0 false rejections against both
  # data/golden/eval.json (60 rows) and data/golden/fewshot.json (150
  # rows) -- see scripts/evaluate_compliance_gate.py.
  incose_gate_threshold: 80.0

consistency:
  # Threshold for marking requirements as duplicates (0.0-1.0)
  duplicate_threshold: 0.95
  # Threshold for marking requirements as similar (0.0-1.0)
  similarity_threshold: 0.80
  # Sentence transformer model for embeddings (offline, local)
  # Falls back to TF-IDF if sentence-transformers is unavailable
  embedding_model: "all-MiniLM-L6-v2"
  # Enable LLM-based contradiction detection (requires Ollama)
  enable_contradiction_check: true

ui:
  api_host: "0.0.0.0"
  api_port: 8000
  streamlit_port: 8501

logging:
  level: "INFO"
