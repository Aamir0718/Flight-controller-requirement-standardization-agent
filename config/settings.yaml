# Central configuration for the requirements-engineering agent.
# Nothing model-specific or environment-specific should be hardcoded
# in application code — read it from here via src/config.py instead.

# OpenAI-compatible chat completions endpoint (vLLM) -- this project no
# longer runs a local Ollama instance; src/llm/local_llm_client.py talks
# plain OpenAI-format JSON to base_url over HTTP via httpx (POST
# {base_url}/chat/completions, GET {base_url}/models). The rest of the
# app (EARS/INCOSE analysis, manual edit, Excel export -- everything
# except the Generate button and consistency's contradiction check) never
# depends on this and keeps working even when this endpoint is down.
llm:
  # DRDO-internal vLLM server. Previously "http://80.0.24:8001/v1", which
  # was missing an octet (only 3 dot-separated numbers, not a valid IPv4
  # address) -- corrected to the 4-octet address from the guide's own
  # reference script (LetMeKnow.py). Still worth a one-time sanity check
  # with `curl http://80.1.0.24:8001/v1/models` from this machine before
  # relying on it in production.
  base_url: "http://80.1.0.24:8001/v1"
  # Must exactly match the model name the vLLM server reports at
  # GET {base_url}/models. Updated to "gemma4-26B-A4B-it" per the guide's
  # reference script -- verify with the curl command above rather than
  # assuming this string is exactly right.
  model: "gemma4-26B-A4B-it"
  # Empty = no Authorization header sent at all. Set this only if the
  # server starts requiring a bearer token.
  api_key: ""
  # This server may be under load from other users -- a large model over
  # a network hop can be slower than a dedicated local GPU. Raise further
  # if requests are timing out rather than genuinely failing.
  request_timeout_seconds: 900
  temperature: 0.2

storage:
  sqlite_path: "data/app.db"

ingestion:
  input_dir: "data/incoming"
  reference_dir: "data/reference"
  golden_dir: "data/golden"
  # Junk/note-row heuristic: a cell must clear this word count AND
  # contain a recognizable verb to be treated as candidate requirement text.
  min_word_count: 4

pipeline:
  candidates_per_requirement: 3
  max_words_per_requirement: 60
  # Minimum INCOSE compliance score (0-100, from src/rules/incose_scorer.py)
  # the best candidate must reach before Finalize will present it as a
  # recommendation instead of setting needs_human_review = true.
  compliance_threshold: 80.0
  # Minimum INCOSE compliance score (0-100, over the ~25 automatable rules
  # IncoseCheck actually runs -- everything except R1/R37/R38, see
  # src/rules/incose_scorer.py's PRE_LLM_GATE_EXCLUDED_RULE_IDS) a
  # requirement's ORIGINAL text must reach before src/pipeline/graph.py's
  # IncoseCheck gate lets it proceed to the EARS gate and, eventually, the
  # LLM. 80.0 measured 0 false rejections against both
  # data/golden/eval.json (60 rows) and data/golden/fewshot.json (150
  # rows) -- see scripts/evaluate_compliance_gate.py.
  incose_gate_threshold: 80.0

consistency:
  # Threshold for marking requirements as duplicates (0.0-1.0)
  duplicate_threshold: 0.95
  # Threshold for marking requirements as similar (0.0-1.0)
  similarity_threshold: 0.80
  # Sentence transformer model for embeddings (offline, local)
  # Falls back to TF-IDF if sentence-transformers is unavailable
  embedding_model: "all-MiniLM-L6-v2"
  # Enable LLM-based contradiction detection (requires the llm.base_url
  # endpoint above; skipped gracefully, not a failure, if it's unreachable
  # -- see ConsistencyResult.contradiction_check_skipped)
  enable_contradiction_check: true

ui:
  api_host: "0.0.0.0"
  api_port: 8000
  streamlit_port: 8501

logging:
  level: "INFO"
